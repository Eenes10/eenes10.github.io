<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Benim Sayfam</title>
<meta name="description" content="Kişisel sayfam: sosyal hesaplarım ve not defteri.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤍</text></svg>">
<style>
:root{
  --bg:#0b0b14; --card:rgba(255,255,255,.06); --border:rgba(255,255,255,.12);
  --text:#f4f4f8; --muted:#a0a0b8; --accent:#8b5cf6; --accent2:#ec4899;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f5f4fb; --card:rgba(255,255,255,.75); --border:rgba(0,0,0,.08); --text:#16161f; --muted:#62627a;}
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-x:hidden;
}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.35;z-index:-1;pointer-events:none}
.b1{width:340px;height:340px;background:var(--accent);top:-80px;left:-80px}
.b2{width:300px;height:300px;background:var(--accent2);bottom:-60px;right:-80px}
main{max-width:520px;margin:0 auto;padding:48px 20px 40px}

/* Profil */
.profile{text-align:center;margin-bottom:32px}
.avatar{
  width:104px;height:104px;border-radius:50%;margin:0 auto 18px;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  display:grid;place-items:center;font-size:42px;font-weight:700;color:#fff;
  box-shadow:0 10px 40px rgba(139,92,246,.45);overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:1.7rem;letter-spacing:-.02em}
.bio{color:var(--muted);margin-top:8px;line-height:1.5}

/* Linkler */
.links{display:flex;flex-direction:column;gap:12px}
.link{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;
  background:var(--card);border:1px solid var(--border);color:var(--text);text-decoration:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .2s,border-color .2s,box-shadow .2s;
}
.link:hover,.link:focus-visible{transform:translateY(-2px);border-color:var(--c);box-shadow:0 8px 28px -10px var(--c);outline:none}
.link:active{transform:scale(.98)}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--c);flex-shrink:0}
.ico svg{width:24px;height:24px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.link .t{flex:1;min-width:0}
.link b{display:block;font-size:1rem}
.link small{color:var(--muted);font-size:.85rem}
.arrow{color:var(--muted);font-size:1.2rem}

/* Notlar */
.notes{margin-top:48px}
.notes h2{font-size:1.3rem;margin-bottom:4px}
.notes>p{color:var(--muted);font-size:.92rem;margin-bottom:16px}
form{display:flex;flex-direction:column;gap:10px;background:var(--card);border:1px solid var(--border);padding:16px;border-radius:18px}
input,textarea{
  width:100%;font:inherit;font-size:16px;color:var(--text);background:rgba(127,127,160,.12);
  border:1px solid var(--border);border-radius:12px;padding:12px;outline:none;resize:vertical;
}
input:focus,textarea:focus{border-color:var(--accent)}
textarea{min-height:90px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.count{color:var(--muted);font-size:.8rem}
button{
  font:inherit;font-weight:600;color:#fff;border:0;border-radius:12px;padding:11px 20px;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent2));transition:opacity .2s,transform .1s;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.5;cursor:not-allowed}
.hp{position:absolute;left:-9999px}
.msg{font-size:.85rem;min-height:1.1em}
.msg.err{color:#f87171}.msg.ok{color:#4ade80}
.list{margin-top:18px;display:flex;flex-direction:column;gap:10px}
.note{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px 16px;animation:in .3s ease}
.note .who{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;margin-bottom:6px}
.note .who b{color:var(--accent)}
.note .who span{color:var(--muted)}
.note p{line-height:1.5;white-space:pre-wrap;word-break:break-word}
.empty{text-align:center;color:var(--muted);padding:20px}
.demo{font-size:.8rem;background:rgba(250,204,21,.12);border:1px solid rgba(250,204,21,.4);color:#facc15;padding:8px 12px;border-radius:12px;margin-bottom:12px}
footer{text-align:center;color:var(--muted);font-size:.8rem;margin-top:40px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div>

<main>
  <section class="profile">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
  </section>

  <nav class="links" id="links" aria-label="Sosyal hesaplarım"></nav>

  <section class="notes" id="notes">
    <h2>💬 Not Defteri</h2>
    <p>Bana bir not bırak, herkes görebilir.</p>
    <div class="demo" id="demo" hidden>Demo mod: Firebase bağlı değil, notlar sadece bu tarayıcıda görünür.</div>
    <form id="form" autocomplete="off">
      <input id="who" maxlength="30" placeholder="Adın (boş bırakırsan Anonim)">
      <textarea id="text" maxlength="280" placeholder="Notunu yaz..." required></textarea>
      <input class="hp" id="hp" tabindex="-1" aria-hidden="true">
      <div class="row">
        <span class="count" id="count">0/280</span>
        <button id="send" type="submit">Gönder</button>
      </div>
      <div class="msg" id="msg" role="status"></div>
    </form>
    <div class="list" id="list"><div class="empty">Yükleniyor...</div></div>
  </section>

  <footer>© <span id="year"></span> · <span id="foot"></span></footer>
</main>

<script>
/* ============ BURAYI KENDİNE GÖRE DÜZENLE ============ */
const CONFIG = {
  name: "Enes Yavuz",
  bio: "herhangi bir adam",
  avatar: "",   // istersen fotoğraf yolu: "foto.jpg" (boşsa ismin baş harfi görünür)
  links: [
    { key:"spotify",   label:"Spotify",   sub:"Çalma listelerim",  url:"https://open.spotify.com/user/31x46gloovijc3vq7grg26fkpgka", color:"#1db954" },
    { key:"instagram", label:"Instagram", sub:"@Enesyavuz07",     url:"https://instagram.com/enesyavuz07",        color:"#e1306c" },
    { key:"tiktok",    label:"TikTok",    sub:"@enes._.yavuz",     url:"https://www.tiktok.com/@enes._.yavuz",          color:"#111827" },
    { key:"x",         label:"X",         sub:"@Enesszzsz",     url:"https://x.com/Enesszzsz",                color:"#000000" }
  ],
  // Firebase Firestore bilgilerin (kurulum adımlarına bak). Boş bırakırsan demo modda çalışır.
  firebase: { projectId: "enes-41855", apiKey: "AIzaSyAoU1VY8M4DYlMu_XP7dpTzO702d9ZEXJU" }
};
/* ====================================================== */

const ICONS = {
  spotify:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M7 9.5c3.5-1 7-.7 10 1M7.5 12.8c3-.8 6-.5 8.5 1M8 16c2.5-.6 5-.4 7 .7"/></svg>',
  instagram:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.3" cy="6.7" r=".6"/></svg>',
  tiktok:'<svg viewBox="0 0 24 24"><path d="M14 3v11.5a3.5 3.5 0 1 1-3.5-3.5"/><path d="M14 3c.3 2.5 2 4.3 5 4.5"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M4 4l16 16M20 4L4 20"/></svg>'
};

const $ = id => document.getElementById(id);

// Profil
document.title = CONFIG.name;
$("name").textContent = CONFIG.name;
$("bio").textContent = CONFIG.bio;
$("foot").textContent = CONFIG.name;
$("year").textContent = new Date().getFullYear();
if (CONFIG.avatar) { const i = new Image(); i.src = CONFIG.avatar; i.alt = CONFIG.name; $("avatar").appendChild(i); }
else $("avatar").textContent = (CONFIG.name.trim()[0] || "?").toUpperCase();

// Linkler
CONFIG.links.forEach(l => {
  const a = document.createElement("a");
  a.className = "link"; a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.style.setProperty("--c", l.color);
  a.innerHTML = `<span class="ico">${ICONS[l.key] || ""}</span>
    <span class="t"><b></b><small></small></span><span class="arrow">↗</span>`;
  a.querySelector("b").textContent = l.label;
  a.querySelector("small").textContent = l.sub;
  $("links").appendChild(a);
});

// Notlar
const fb = CONFIG.firebase;
const LIVE = !!(fb.projectId && fb.apiKey);
const BASE = LIVE ? `https://firestore.googleapis.com/v1/projects/${fb.projectId}/databases/(default)/documents/notes` : "";
if (!LIVE) $("demo").hidden = false;

const store = {
  async list(){
    if (!LIVE) { try { return JSON.parse(localStorage.getItem("notes") || "[]"); } catch { return []; } }
    const r = await fetch(`${BASE}?pageSize=50&orderBy=${encodeURIComponent("createdAt desc")}&key=${fb.apiKey}`);
    if (!r.ok) throw new Error("list");
    const d = await r.json();
    return (d.documents || []).map(x => ({
      name: x.fields.name?.stringValue || "Anonim",
      text: x.fields.text?.stringValue || "",
      createdAt: x.fields.createdAt?.timestampValue
    }));
  },
  async add(n){
    if (!LIVE) {
      const all = await this.list(); all.unshift(n);
      try { localStorage.setItem("notes", JSON.stringify(all.slice(0,50))); } catch {}
      return;
    }
    const r = await fetch(`${BASE}?key=${fb.apiKey}`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ fields:{
        name:{stringValue:n.name}, text:{stringValue:n.text}, createdAt:{timestampValue:n.createdAt}
      }})
    });
    if (!r.ok) throw new Error("add");
  }
};

function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "az önce";
  if (s < 3600) return Math.floor(s/60) + " dk önce";
  if (s < 86400) return Math.floor(s/3600) + " sa önce";
  if (s < 2592000) return Math.floor(s/86400) + " gün önce";
  return new Date(iso).toLocaleDateString("tr-TR");
}

function render(notes){
  const list = $("list"); list.innerHTML = "";
  if (!notes.length) { list.innerHTML = '<div class="empty">Henüz not yok, ilk notu sen bırak! </div>'; return; }
  notes.forEach(n => {
    const el = document.createElement("div"); el.className = "note";
    el.innerHTML = '<div class="who"><b></b><span></span></div><p></p>';
    el.querySelector("b").textContent = n.name;
    el.querySelector("span").textContent = ago(n.createdAt);
    el.querySelector("p").textContent = n.text;
    list.appendChild(el);
  });
}

async function load(){
  try { render(await store.list()); }
  catch { $("list").innerHTML = '<div class="empty">Notlar yüklenemedi 😕</div>'; }
}

const text = $("text");
text.addEventListener("input", () => $("count").textContent = text.value.length + "/280");

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("msg"); msg.className = "msg";
  if ($("hp").value) return; // bot tuzağı
  const last = +localStorage.getItem("lastNote") || 0;
  if (Date.now() - last < 30000) { msg.textContent = "Biraz bekle, 30 saniyede bir not bırakabilirsin."; msg.classList.add("err"); return; }
  const note = {
    name: ($("who").value.trim() || "Anonim").slice(0,30),
    text: text.value.trim().slice(0,280),
    createdAt: new Date().toISOString()
  };
  if (!note.text) return;
  $("send").disabled = true;
  try {
    await store.add(note);
    try { localStorage.setItem("lastNote", Date.now()); } catch {}
    text.value = ""; $("count").textContent = "0/280";
    msg.textContent = "Notun eklendi, teşekkürler! 💜"; msg.classList.add("ok");
    await load();
  } catch {
    msg.textContent = "Gönderilemedi, tekrar dene."; msg.classList.add("err");
  }
  $("send").disabled = false;
});

load();
</script>
</body>
</html>
