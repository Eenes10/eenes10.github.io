<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#f5f9ff">
<title>Enes Yavuz</title>
<meta name="description" content="Kişisel sayfam: sosyal hesaplarım ve not defteri.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤍</text></svg>">
<style>
:root{
  color-scheme:light;
  --bg:#f5f9ff;
  --navy:#12307f;  --blue:#1f63e0;  --blue-soft:#6f93d6;  --blue-main:#3b9bff;  --blue-main2:#66b5ff;
  --line:#dfeaff;
  --panel:#eaf2ff;
  --shadow:0 10px 30px -16px rgba(47,123,255,.35);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--navy);min-height:100vh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  overflow-x:hidden;
}
.shape{position:fixed;z-index:-1;pointer-events:none}
.s1{top:-140px;left:-170px;width:440px;height:380px;
  border-radius:40% 60% 70% 30% / 40% 50% 60% 50%;
  background:linear-gradient(140deg,#b5d6ff,#e3f0ff)}
.s2{right:-200px;top:30%;width:400px;height:400px;border-radius:50%;
  background:linear-gradient(160deg,#d7e9ff,#9cc9ff);opacity:.6}
.s3{left:-140px;bottom:-160px;width:340px;height:340px;border-radius:50%;
  background:linear-gradient(40deg,#cfe3ff,#eef5ff);opacity:.8}

main{max-width:520px;margin:0 auto;padding:44px 20px 40px}

.profile{text-align:center;margin-bottom:30px}
.avatar{
  width:104px;height:104px;border-radius:50%;margin:0 auto 20px;
  background:linear-gradient(145deg,var(--blue-main),var(--blue-main2));
  display:grid;place-items:center;font-size:48px;font-weight:700;color:#fff;
  box-shadow:0 0 0 8px rgba(59,155,255,.12),0 16px 40px -10px rgba(59,155,255,.6);overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:1.9rem;font-weight:800;letter-spacing:-.02em;color:var(--navy)}
.bio{color:var(--blue-soft);margin-top:8px;font-size:1.05rem}

.links{display:flex;flex-direction:column;gap:12px}
.link{
  display:flex;align-items:center;gap:16px;padding:14px 18px 14px 14px;border-radius:26px;
  background:#fff;border:1px solid var(--line);text-decoration:none;
  box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;
}
.link:hover,.link:focus-visible{transform:translateY(-3px);box-shadow:0 16px 32px -14px rgba(47,123,255,.55);outline:none}
.link:active{transform:scale(.98)}
.ico{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--bg);flex-shrink:0;
  box-shadow:0 6px 14px -6px rgba(0,0,0,.35)}
.logo{position:relative;width:28px;height:28px;display:block}
.logo img{position:relative;z-index:1;width:100%;height:100%;display:block;filter:brightness(0) invert(1)}
.logo i{position:absolute;inset:0;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat}
.logo i.c{background:#25f4ee;transform:translate(-1.6px,-1.2px)}
.logo i.p{background:#fe2c55;transform:translate(1.6px,1.2px)}
.link .t{flex:1;min-width:0}
.link b{display:block;font-size:1.12rem;color:var(--blue);font-weight:700}
.link small{color:var(--blue-soft);font-size:.92rem}
.arrow{width:20px;height:20px;stroke:#2f7bff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

.notes{margin-top:40px}
.nh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.nh svg{width:44px;height:44px;flex-shrink:0}
.nh h2{font-size:1.3rem;color:var(--blue);font-weight:700;line-height:1.2}
.nh p{color:var(--blue-soft);font-size:.92rem}
form{background:var(--panel);padding:14px;border-radius:26px;display:flex;flex-direction:column;gap:10px}
input,textarea{
  width:100%;font:inherit;font-size:16px;color:var(--navy);background:#fff;
  border:1.5px solid #cfe2ff;border-radius:999px;padding:13px 20px;outline:none;transition:border-color .2s,box-shadow .2s;
}
input::placeholder,textarea::placeholder{color:#9bb5e6}
input:focus,textarea:focus{border-color:var(--blue-main);box-shadow:0 0 0 4px rgba(59,155,255,.15)}
textarea{border-radius:22px;resize:none;min-height:52px;max-height:160px;display:block}
.compose{display:flex;align-items:flex-end;gap:10px}
.send{
  width:52px;height:52px;border-radius:50%;border:0;cursor:pointer;flex-shrink:0;
  background:linear-gradient(145deg,var(--blue-main),var(--blue-main2));
  display:grid;place-items:center;box-shadow:0 10px 20px -8px rgba(47,123,255,.8);
  transition:transform .1s,opacity .2s;
}
.send svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-left:-2px}
.send:active{transform:scale(.93)}
.send:disabled{opacity:.5;cursor:not-allowed}
.hp{position:absolute;left:-9999px}
.meta{display:flex;justify-content:space-between;gap:10px;padding:0 6px;font-size:.8rem;color:var(--blue-soft)}
.msg.err{color:#dc2626}.msg.ok{color:#16a34a}

.list{margin-top:16px;display:flex;flex-direction:column;gap:10px}
.note{display:flex;gap:12px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);animation:in .3s ease}
.note .av{width:40px;height:40px;border-radius:50%;flex-shrink:0;display:grid;place-items:center;font-weight:700;color:#fff;
  background:linear-gradient(145deg,var(--blue-main),var(--blue-main2))}
.note .body{min-width:0;flex:1}
.note .who{display:flex;justify-content:space-between;gap:8px;font-size:.88rem;margin-bottom:3px}
.note .who b{color:var(--blue)}
.note .who span{color:var(--blue-soft)}
.note p{line-height:1.5;white-space:pre-wrap;word-break:break-word;color:var(--navy)}
.empty{text-align:center;color:var(--blue-soft);padding:20px}
.demo{font-size:.8rem;background:#fff8e1;border:1px solid #ffe08a;color:#8a6100;padding:8px 12px;border-radius:14px;margin-bottom:12px}
footer{text-align:center;color:var(--blue-soft);font-size:.8rem;margin-top:40px}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shape s1"></div><div class="shape s2"></div><div class="shape s3"></div>

<main>
  <section class="profile">
    <div class="avatar" id="avatar"></div>
    <h1 id="name"></h1>
    <p class="bio" id="bio"></p>
  </section>

  <nav class="links" id="links" aria-label="Sosyal hesaplarım"></nav>

  <section class="notes" id="notes">
    <div class="nh">
      <svg viewBox="0 0 48 48" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3b9bff"/><stop offset="1" stop-color="#66b5ff"/></linearGradient></defs>
        <path d="M24 4C12.4 4 4 11.7 4 21.5c0 5 2.2 9.400 5.900 12.500L7 43l9.200-4.200c2.500.7 5 1 7.800 1 11.600 0 20-7.700 20-17.500S35.600 4 24 4z" fill="url(#g)"/>
        <circle cx="15" cy="22" r="2.600" fill="#fff"/><circle cx="24" cy="22" r="2.600" fill="#fff"/><circle cx="33" cy="22" r="2.600" fill="#fff"/>
      </svg>
      <div><h2>Not Defteri</h2><p>Bana bir not bırak, herkes görebilir.</p></div>
    </div>
    <div class="demo" id="demo" hidden>Demo mod: Firebase bağlı değil, notlar sadece bu tarayıcıda görünür.</div>
    <form id="form" autocomplete="off">
      <input id="who" maxlength="30" placeholder="Adın (boş bırakırsan Anonim)">
      <div class="compose">
        <textarea id="text" maxlength="280" rows="1" placeholder="Notunu yaz..." required></textarea>
        <button class="send" id="send" type="submit" aria-label="Gönder">
          <svg viewBox="0 0 24 24"><path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/></svg>
        </button>
      </div>
      <input class="hp" id="hp" tabindex="-1" aria-hidden="true">
      <div class="meta"><span class="msg" id="msg" role="status"></span><span id="count">0/280</span></div>
    </form>
    <div class="list" id="list"><div class="empty">Yükleniyor...</div></div>
  </section>

  <footer>© <span id="year"></span> · <span id="foot"></span></footer>
</main>

<script>
const CONFIG = {
  name: "Enes Yavuz",
  bio: "herhangi bir adam",
  avatar: "",
  links: [
    { key:"spotify",   label:"Spotify",   sub:"Çalma listelerim", url:"https://open.spotify.com/user/31x46gloovijc3vq7grg26fkpgka", bg:"#1ed760" },
    { key:"instagram", label:"Instagram", sub:"@Enesyavuz07",     url:"https://instagram.com/enesyavuz07",
      bg:"linear-gradient(45deg,#fdc468,#f5833f 25%,#e1306c 55%,#a437c4 80%,#5b51d8)" },
    { key:"tiktok",    label:"TikTok",    sub:"@enes._.yavuz",    url:"https://www.tiktok.com/@enes._.yavuz", bg:"#0b0f26", fx:true },
    { key:"x",         label:"X",         sub:"@Enesszzsz",       url:"https://x.com/Enesszzsz", bg:"#000000" }
  ],
  firebase: { projectId: "enes-41855", apiKey: "AIzaSyAoU1VY8M4DYlMu_XP7dpTzO702d9ZEXJU" }
};

const LOGO = key => `https://cdn.jsdelivr.net/npm/simple-icons@11.14.0/icons/${key}.svg`;
const ARROW = '<svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18L18 6"/><path d="M8 6h10v10"/></svg>';

const $ = id => document.getElementById(id);

document.title = CONFIG.name;
$("name").textContent = CONFIG.name;
$("bio").textContent = CONFIG.bio;
$("foot").textContent = CONFIG.name;
$("year").textContent = new Date().getFullYear();
if (CONFIG.avatar) { const i = new Image(); i.src = CONFIG.avatar; i.alt = CONFIG.name; $("avatar").appendChild(i); }
else $("avatar").textContent = (CONFIG.name.trim()[0] || "?").toUpperCase();

CONFIG.links.forEach(l => {
  const a = document.createElement("a");
  a.className = "link"; a.href = l.url; a.target = "_blank"; a.rel = "noopener noreferrer";
  a.innerHTML = `<span class="ico"><span class="logo"></span></span>
    <span class="t"><b></b><small></small></span>${ARROW}`;
  a.querySelector(".ico").style.background = l.bg;
  const logo = a.querySelector(".logo");
  if (l.fx) {
    logo.style.setProperty("--m", `url("${LOGO(l.key)}")`);
    logo.innerHTML = '<i class="c"></i><i class="p"></i>';
  }
  const img = document.createElement("img");
  img.alt = ""; img.src = LOGO(l.key);
  img.onerror = () => { logo.textContent = l.label[0]; logo.style.cssText += ";color:#fff;font-weight:700;text-align:center;line-height:28px"; };
  logo.appendChild(img);
  a.querySelector("b").textContent = l.label;
  a.querySelector("small").textContent = l.sub;
  $("links").appendChild(a);
});

const fb = CONFIG.firebase;
const LIVE = !!(fb.projectId && fb.apiKey);
const BASE = LIVE ? `https://firestore.googleapis.com/v1/projects/${fb.projectId}/databases/(default)/documents/notes` : "";
if (!LIVE) $("demo").hidden = false;

const store = {
  async list(){
    if (!LIVE) { try { return JSON.parse(localStorage.getItem("notes") || "[]"); } catch { return []; } }
    const r = await fetch(`${BASE}?pageSize=50&orderBy=${encodeURIComponent("createdAt desc")}&key=${fb.apiKey}`);
    if (!r.ok) throw new Error("list");
    const d = await r.json();
    return (d.documents || []).map(x => ({
      name: x.fields.name?.stringValue || "Anonim",
      text: x.fields.text?.stringValue || "",
      createdAt: x.fields.createdAt?.timestampValue
    }));
  },
  async add(n){
    if (!LIVE) {
      const all = await this.list(); all.unshift(n);
      try { localStorage.setItem("notes", JSON.stringify(all.slice(0,50))); } catch {}
      return;
    }
    const r = await fetch(`${BASE}?key=${fb.apiKey}`, {
      method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ fields:{
        name:{stringValue:n.name}, text:{stringValue:n.text}, createdAt:{timestampValue:n.createdAt}
      }})
    });
    if (!r.ok) throw new Error("add");
  }
};

function ago(iso){
  const s = (Date.now() - new Date(iso)) / 1000;
  if (s < 60) return "az önce";
  if (s < 3600) return Math.floor(s/60) + " dk önce";
  if (s < 86400) return Math.floor(s/3600) + " sa önce";
  if (s < 2592000) return Math.floor(s/86400) + " gün önce";
  return new Date(iso).toLocaleDateString("tr-TR");
}

function render(notes){
  const list = $("list"); list.innerHTML = "";
  if (!notes.length) { list.innerHTML = '<div class="empty">Henüz not yok, ilk notu sen bırak! ✨</div>'; return; }
  notes.forEach(n => {
    const el = document.createElement("div"); el.className = "note";
    el.innerHTML = '<div class="av"></div><div class="body"><div class="who"><b></b><span></span></div><p></p></div>';
    el.querySelector(".av").textContent = (n.name.trim()[0] || "?").toUpperCase();
    el.querySelector("b").textContent = n.name;
    el.querySelector("span").textContent = ago(n.createdAt);
    el.querySelector("p").textContent = n.text;
    list.appendChild(el);
  });
}

async function load(){
  try { render(await store.list()); }
  catch { $("list").innerHTML = '<div class="empty">Notlar yüklenemedi 😕</div>'; }
}

const text = $("text");
function grow(){ text.style.height = "auto"; text.style.height = Math.min(text.scrollHeight, 160) + "px"; }
text.addEventListener("input", () => { $("count").textContent = text.value.length + "/280"; grow(); });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  const msg = $("msg"); msg.className = "msg";
  if ($("hp").value) return;
  const last = +localStorage.getItem("lastNote") || 0;
  if (Date.now() - last < 30000) { msg.textContent = "30 saniye bekle."; msg.classList.add("err"); return; }
  const note = {
    name: ($("who").value.trim() || "Anonim").slice(0,30),
    text: text.value.trim().slice(0,280),
    createdAt: new Date().toISOString()
  };
  if (!note.text) return;
  $("send").disabled = true;
  try {
    await store.add(note);
    try { localStorage.setItem("lastNote", Date.now()); } catch {}
    text.value = ""; grow(); $("count").textContent = "0/280";
    msg.textContent = "Notun eklendi, teşekkürler! 💙"; msg.classList.add("ok");
    await load();
  } catch {
    msg.textContent = "Gönderilemedi, tekrar dene."; msg.classList.add("err");
  }
  $("send").disabled = false;
});

load();
</script>
</body>
</html>
